name: MindGuru Prompter APK

on:
  push:
    paths:
      - 'mindguru_prompter/**'
      - '.github/workflows/mindguru-prompter-apk.yml'
  pull_request:
    paths:
      - 'mindguru_prompter/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mindguru_prompter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: mindguru-prompter-arm64-apk
          path: mindguru_prompter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
